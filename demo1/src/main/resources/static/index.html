<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: linear-gradient(135deg, #f8ffae 0%, #43c6ac 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 8px #fff;
        }
        button {
            background: #43c6ac;
            color: #fff;
            border: none;
            padding: 15px 35px;
            border-radius: 25px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(67,198,172,0.2);
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: #191654;
            transform: translateY(-2px) scale(1.05);
        }
        /* Animated bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 12s infinite linear;
        }
        .bubble1 { width: 80px; height: 80px; left: 10%; top: 70%; background: #43c6ac; animation-delay: 0s;}
        .bubble2 { width: 50px; height: 50px; left: 80%; top: 80%; background: #f8ffae; animation-delay: 1s;}
        .bubble3 { width: 100px; height: 100px; left: 50%; top: 90%; background: #191654; animation-delay: 2s;}
        .bubble4 { width: 60px; height: 60px; left: 30%; top: 85%; background: #43c6ac; animation-delay: 3s;}
        .bubble5 { width: 40px; height: 40px; left: 70%; top: 95%; background: #f8ffae; animation-delay: 4s;}
        @keyframes float {
            0% { transform: translateY(0) scale(1);}
            50% { transform: translateY(-400px) scale(1.2);}
            100% { transform: translateY(0) scale(1);}
        }
    </style>
</head>
<body>
    <!-- Animated bubbles -->
    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>
    <div class="bubble bubble4"></div>
    <div class="bubble bubble5"></div>
    <h1>
        <i style="color: #43c6ac; font-weight: bold; letter-spacing: 2px; text-shadow: 2px 2px 10px #fff, 0 1px 0 #43c6ac;">
            Welcome to <span style="color: #191654;">SpringBoot</span> 🚀✨
        </i>
    </h1>
    <div style="display: flex; gap: 30px; align-items: center; justify-content: center;">
        <form action="/get" method="get">
            <button type="submit">Go to Get</button>
        </form>
        <form action="/post" method="post" style="margin-bottom: 15px;padding-top: 15px;">
            <button type="submit">Go to Post</button>
        </form>
    </div>

    <!-- for simple calculator -->
    <!-- <div>
        <form action="/dem" method="post">
            <input type="text" name="num1">
            <input type="text" name="num2">
            <input type="submit" value="submit">
        </form>
    </div> -->

</body>
</html>
